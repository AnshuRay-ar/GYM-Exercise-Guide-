<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anshu's Workout</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d; --surface: #161616; --surface2: #1e1e1e;
    --border: rgba(255,255,255,0.07); --border-hi: rgba(255,255,255,0.14);
    --text: #f0ece4; --muted: #6b6b6b;
    --accent: #c8f050; --accent-dim: rgba(200,240,80,0.12); --accent-text: #0d0d0d;
    --red: #ff4d4d; --red-dim: rgba(255,77,77,0.12);
    --blue: #4da6ff; --blue-dim: rgba(77,166,255,0.1);
    --orange: #ff8c42; --orange-dim: rgba(255,140,66,0.1);
    --green: #4cde8f; --green-dim: rgba(76,222,143,0.1);
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100dvh; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  .app { width:100%; max-width:480px; margin:0 auto; padding-bottom:90px; }

  /* ── HEADER ── */
  .header {
    padding: 16px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .header-title-block {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .app-name {
    font-family: 'Syne', sans-serif;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
    line-height: 1;
  }
  .app-name span { color: var(--accent); }
  .app-sub {
    font-size: 11px;
    color: var(--muted);
    font-weight: 300;
  }
  .header-btns {
    display: flex;
    gap: 8px;
    align-items: center;
    width: 100%;
  }
  .today-btn {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .4px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity .15s, transform .15s;
    flex-shrink: 0;
  }
  .today-btn:active { transform: scale(.95); opacity: .85; }
  .date-input {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-hi);
    border-radius: 8px;
    padding: 9px 10px;
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color-scheme: dark;
    outline: none;
    transition: border-color .15s;
    flex: 1;
    min-width: 0;
  }
  .date-input:focus { border-color: var(--accent); }

  /* ── STRIP ── */
  .strip-wrap { overflow-x:auto; scrollbar-width:none; padding:0 14px 4px; }
  .strip-wrap::-webkit-scrollbar { display:none; }
  .strip { display:flex; gap:6px; width:max-content; }
  .chip { display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); cursor:pointer; transition:all .2s; min-width:58px; position:relative; }
  .chip:active { opacity:.7; }
  .chip.active { background:var(--accent); border-color:var(--accent); }
  .chip-wr { font-family:'Syne',sans-serif; font-size:8px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
  .chip-dt { font-size:12px; font-weight:500; color:var(--text); }
  .chip.active .chip-wr { color:rgba(13,13,13,.6); }
  .chip.active .chip-dt { color:var(--accent-text); font-weight:700; }
  .today-dot { width:4px; height:4px; border-radius:50%; background:var(--accent); position:absolute; bottom:5px; }
  .chip.active .today-dot { background:var(--accent-text); }
  .hint { text-align:center; font-size:9px; letter-spacing:2px; color:rgba(255,255,255,.1); padding:5px 0 3px; text-transform:uppercase; }

  /* ── VIEWPORT ── */
  .viewport { overflow:hidden; width:100%; }
  .slider { display:flex; will-change:transform; transition:transform .4s cubic-bezier(.4,0,.2,1); }
  .panel { width:100vw; max-width:480px; flex-shrink:0; padding:10px 14px 16px; }

  /* ── SESSION HEADER ── */
  .sess-hdr { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px; position:relative; overflow:hidden; }
  .sess-hdr::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--accent); }
  .sh-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .sh-info { flex:1; min-width:0; }
  .sh-name { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; letter-spacing:-.3px; line-height:1; }
  .sh-type { font-size:11px; color:var(--muted); margin-top:4px; font-weight:300; line-height:1.4; word-break:break-word; }
  .sh-stats { display:flex; gap:6px; flex-shrink:0; }
  .stat { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 10px; text-align:center; min-width:40px; }
  .stat-n { font-family:'Syne',sans-serif; font-size:15px; font-weight:700; color:var(--accent); }
  .stat-l { font-size:8px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-top:2px; }
  .mrow { display:flex; flex-wrap:wrap; gap:5px; }
  .mtag { font-size:10px; font-weight:500; padding:3px 8px; border-radius:100px; }
  .mp { background:var(--accent-dim); color:var(--accent); border:1px solid rgba(200,240,80,.2); }
  .ms { background:transparent; color:var(--muted); border:1px solid var(--border); }

  /* ── EXERCISE CARD ── */
  .ex-list { display:flex; flex-direction:column; gap:8px; }
  .exc { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; animation:slideUp .35s ease both; }
  @keyframes slideUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .ex-top { display:flex; align-items:flex-start; gap:8px; margin-bottom:8px; }
  .ex-num { font-family:'Syne',sans-serif; font-size:10px; font-weight:700; color:var(--accent); flex-shrink:0; padding-top:2px; min-width:18px; }
  .ex-name { font-size:13px; font-weight:500; color:var(--text); flex:1; line-height:1.35; word-break:break-word; }
  .form-btn {
    display:inline-flex; align-items:center; gap:4px;
    text-decoration:none; font-size:10px; font-weight:700;
    font-family:'Syne',sans-serif; letter-spacing:.2px;
    padding:6px 9px; border-radius:7px; flex-shrink:0;
    transition:opacity .15s, transform .15s; white-space:nowrap;
    background:var(--red-dim); color:var(--red);
    border:1px solid rgba(255,77,77,.25); cursor:pointer;
  }
  .form-btn:active { opacity:.7; transform:scale(.95); }
  .form-btn svg { width:10px; height:10px; fill:currentColor; flex-shrink:0; }
  .ex-meta { display:flex; flex-wrap:wrap; gap:5px; }
  .tag { font-size:10px; padding:3px 8px; border-radius:100px; font-weight:500; line-height:1.4; }
  .t-bias { background:transparent; color:var(--muted); border:1px solid var(--border); }
  .t-sets { background:var(--blue-dim); color:var(--blue); border:1px solid rgba(77,166,255,.2); }
  .t-reps { background:var(--accent-dim); color:var(--accent); border:1px solid rgba(200,240,80,.2); }
  .t-note { background:var(--orange-dim); color:var(--orange); border:1px solid rgba(255,140,66,.2); font-style:italic; }
  .t-compound { background:var(--orange-dim); color:var(--orange); border:1px solid rgba(255,140,66,.25); }

  /* ── REST DAY ── */
  .rest-panel { padding:28px 10px; text-align:center; }
  .rest-icon { width:56px; height:56px; border-radius:50%; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:24px; margin:0 auto 12px; }
  .rest-title { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; margin-bottom:8px; }
  .rest-desc { font-size:13px; color:var(--muted); line-height:1.8; margin-bottom:16px; font-weight:300; }
  .rest-acts { display:flex; flex-direction:column; gap:7px; }
  .ract { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 14px; font-size:13px; color:var(--text); text-align:left; }
  .rdot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

  /* ── BOTTOM NAV ── */
  .bnav { position:fixed; bottom:0; left:0; right:0; background:rgba(13,13,13,.97); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--border); padding:8px 10px; padding-bottom:calc(8px + env(safe-area-inset-bottom, 0px)); display:flex; justify-content:center; flex-wrap:wrap; gap:5px; z-index:100; }
  .npill { font-family:'Syne',sans-serif; font-size:10px; font-weight:700; letter-spacing:.5px; padding:6px 11px; border-radius:100px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; transition:all .18s; white-space:nowrap; }
  .npill:active { opacity:.7; }
  .npill.on { background:var(--accent); border-color:var(--accent); color:var(--accent-text); }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-title-block">
      <div class="app-name">Anshu's <span>Workout</span></div>
      <div class="app-sub">Upper / Lower Split · 6-day rotation</div>
    </div>
    <div class="header-btns">
      <button class="today-btn" id="todayBtn">↩ Today</button>
      <input type="date" class="date-input" id="dateInput">
    </div>
  </header>

  <div class="strip-wrap"><div class="strip" id="strip"></div></div>
  <p class="hint">swipe or tap to navigate</p>
  <div class="viewport" id="vp"><div class="slider" id="sl"></div></div>
</div>
<nav class="bnav" id="bnav"></nav>

<script>
const PAT = ['upper-a','lower-a','upper-b','lower-b','upper-c','upper-d'];
const LBL = {'upper-a':'Upper A','upper-b':'Upper B','upper-c':'Upper C','upper-d':'Upper D','lower-a':'Lower A','lower-b':'Lower B','rest':'Rest'};
const TYPE = {
  'upper-a':'Chest · Shoulders · Triceps · Rotator Cuff',
  'upper-b':'Back · Rear Delts · Biceps · Forearms',
  'upper-c':'Chest · Back · Lateral Delts · Arms',
  'upper-d':'Shoulders · Delts · Triceps · Biceps · Abs',
  'lower-a':'Quads · Hamstrings · Glutes · Calves · Abs',
  'lower-b':'Posterior Chain · Glutes · Quads · Calves',
  'rest':'Active recovery'
};
const START = new Date('2025-02-11');
const MUSCLES = {
  'upper-a':{ p:['Chest','Shoulders','Triceps'],           s:['Front Delts','Rotator Cuff'] },
  'upper-b':{ p:['Lats','Mid Back','Rear Delts','Biceps'], s:['Forearms','Rhomboids'] },
  'upper-c':{ p:['Chest','Lats','Lateral Delts'],          s:['Triceps','Biceps'] },
  'upper-d':{ p:['Shoulders','Triceps','Biceps','Abs'],    s:['Rear Delts','Brachialis'] },
  'lower-a':{ p:['Quads','Hamstrings','Glutes','Calves'],  s:['Hip Flexors','Abs'] },
  'lower-b':{ p:['Glutes','Hamstrings','Quads','Calves'],  s:['Core','Hip Flexors'] },
};
const EX = {
  'upper-a':[
    {name:'Incline Dumbbell Press',                 bias:'Upper chest + front delt',       sets:4, reps:'6–8',   compound:true},
    {name:'Overhead Press',                         bias:'Front + lateral delt',            sets:3, reps:'8–10',  compound:true},
    {name:'Cable Lateral Raise',                    bias:'Lateral delt (isolation)',        sets:3, reps:'15–20'},
    {name:'Machine Pec Deck',                       bias:'Mid chest (lengthened)',          sets:3, reps:'10–12'},
    {name:'Overhead Cable Triceps Extension',       bias:'Triceps long head (lengthened)',  sets:3, reps:'10–12'},
    {name:'Face Pull',                              bias:'Rear delt + rotator cuff',        sets:3, reps:'15',    note:'Shoulder health — never skip'},
  ],
  'lower-a':[
    {name:'Barbell Squat',                          bias:'Quads (lengthened)',              sets:4, reps:'5–8',   compound:true},
    {name:'Romanian Deadlift',                      bias:'Hamstrings + glutes (lengthened)',sets:3, reps:'8–10',  compound:true},
    {name:'Leg Press',                              bias:'Quads + glutes (volume)',         sets:3, reps:'10–12'},
    {name:'Leg Extension',                          bias:'Quads (shortened)',               sets:3, reps:'12–15'},
    {name:'Seated Leg Curl',                        bias:'Hamstrings (shortened)',          sets:3, reps:'10–12'},
    {name:'Standing Calf Raise',                    bias:'Calves',                          sets:4, reps:'12–15'},
    {name:'Cable Crunch',                           bias:'Abs (lengthened)',                sets:3, reps:'12–15'},
  ],
  'upper-b':[
    {name:'Weighted Pull-Up',                       bias:'Lats + biceps',                  sets:4, reps:'6–8',   compound:true},
    {name:'Meadows Row',                            bias:'Mid back + rhomboids',            sets:3, reps:'8–10',  compound:true},
    {name:'Reverse Pec Deck',                       bias:'Rear delts (lengthened)',         sets:3, reps:'12–15'},
    {name:'Preacher Curl',                          bias:'Biceps (peak contraction)',       sets:3, reps:'8–12'},
    {name:'Bayesian Cable Curl',                    bias:'Biceps (lengthened)',             sets:3, reps:'10–12'},
    {name:'Wrist Curl + Extension',                 bias:'Forearm flexors + extensors',    sets:3, reps:'12–15'},
  ],
  'lower-b':[
    {name:'Deadlift',                               bias:'Full posterior chain',            sets:4, reps:'4–6',   compound:true},
    {name:'Bulgarian Split Squat',                  bias:'Glutes + quads (unilateral)',     sets:3, reps:'8–10',  compound:true},
    {name:'Hip Thrust / Glute Drive',               bias:'Glutes (peak contraction)',       sets:3, reps:'10–12'},
    {name:'Seated Leg Curl',                        bias:'Hamstrings (shortened)',          sets:3, reps:'10–12'},
    {name:'Leg Extension',                          bias:'Quads (shortened)',               sets:3, reps:'12–15'},
    {name:'Standing Calf Raise',                    bias:'Calves',                          sets:4, reps:'12–15'},
  ],
  'upper-c':[
    {name:'Incline Dumbbell Press',                 bias:'Chest compound — 2nd frequency', sets:4, reps:'6–8',   compound:true},
    {name:'Neutral-Grip Lat Pulldown',              bias:'Lats + biceps — 2nd frequency',  sets:3, reps:'8–12',  compound:true},
    {name:'Seated Row Machine',                     bias:'Mid back + rhomboids',            sets:3, reps:'10–12'},
    {name:'Cable Lateral Raise',                    bias:'Lateral delt',                   sets:3, reps:'15–20'},
    {name:'Overhead Cable Triceps Extension',       bias:'Triceps long head',              sets:3, reps:'10–12'},
    {name:'Incline Dumbbell Curl',                  bias:'Biceps (lengthened)',             sets:3, reps:'10–12'},
  ],
  'upper-d':[
    {name:'Machine Shoulder Press',                bias:'Full delt — compound anchor',    sets:4, reps:'8–10',  compound:true},
    {name:'Cable Lateral Raise',                    bias:'Lateral delt (peak width)',      sets:3, reps:'15–20'},
    {name:'Reverse Pec Deck',                       bias:'Rear delts (2nd hit)',            sets:3, reps:'15–20'},
    {name:'Cable Crossover / Pec Deck',             bias:'Chest (lengthened isolation)',   sets:3, reps:'12–15'},
    {name:'Rope Pushdown + Overhead Ext. Superset', bias:'Triceps short + long head',      sets:3, reps:'10–12', note:'Back-to-back, no rest between'},
    {name:'Hammer Curl',                            bias:'Brachialis + brachioradialis',   sets:3, reps:'10–12'},
    {name:'Hanging Leg Raise',                      bias:'Abs + hip flexors',              sets:3, reps:'12–15'},
  ],
};

let sched=[], ai=2, viewDate=new Date();

function isSun(d){ return d.getDay()===0; }
function isToday(d){ return d.toDateString()===new Date().toDateString(); }
function countWD(d){
  const vd=new Date(d); vd.setHours(0,0,0,0);
  const sd=new Date(START); sd.setHours(0,0,0,0);
  let c=0, cur=new Date(sd);
  while(cur<vd){ if(!isSun(cur)) c++; cur.setDate(cur.getDate()+1); }
  return c;
}
function getW(d){ return isSun(d)?'rest':PAT[countWD(d)%PAT.length]; }
function dateKey(d){ return d.toISOString().slice(0,10); }

function ytSearchUrl(name){
  return 'https://www.youtube.com/results?search_query='+encodeURIComponent('how to do '+name+'');
}

function mPanel(w){
  const m=MUSCLES[w]; if(!m) return '';
  return `<div class="mrow">${m.p.map(x=>`<span class="mtag mp">${x}</span>`).join('')}${m.s.map(x=>`<span class="mtag ms">${x}</span>`).join('')}</div>`;
}

function exCard(ex, exIdx, workout){
  const compoundTag = ex.compound ? `<span class="tag t-compound">compound</span>` : '';
  return `<div class="exc" style="animation-delay:${exIdx*0.055}s">
    <div class="ex-top">
      <span class="ex-num">${String(exIdx+1).padStart(2,'0')}</span>
      <span class="ex-name">${ex.name}</span>
      <a class="form-btn" href="${ytSearchUrl(ex.name)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.54 3.5 12 3.5 12 3.5s-7.54 0-9.38.55A3.02 3.02 0 0 0 .5 6.19C0 8.04 0 12 0 12s0 3.96.5 5.81a3.02 3.02 0 0 0 2.12 2.14C4.46 20.5 12 20.5 12 20.5s7.54 0 9.38-.55a3.02 3.02 0 0 0 2.12-2.14C24 15.96 24 12 24 12s0-3.96-.5-5.81zM9.75 15.5v-7l6.5 3.5-6.5 3.5z"/></svg>
        Form Guide
      </a>
    </div>
    <div class="ex-meta">
      ${compoundTag}
      ${ex.bias?`<span class="tag t-bias">${ex.bias}</span>`:''}
      <span class="tag t-sets">${ex.sets} sets</span>
      <span class="tag t-reps">${ex.reps} reps</span>
      ${ex.note?`<span class="tag t-note">${ex.note}</span>`:''}
    </div>
  </div>`;
}

function buildPanel(item){
  const {workout} = item;
  if(workout==='rest') return `<div class="panel"><div class="rest-panel">
    <div class="rest-icon">🌙</div>
    <div class="rest-title">Rest Day</div>
    <div class="rest-desc">Muscles grow while you recover.<br>Keep it light and intentional.</div>
    <div class="rest-acts">
      <div class="ract"><span class="rdot" style="background:#c8f050"></span>Gentle walk 20–30 min</div>
      <div class="ract"><span class="rdot" style="background:#4da6ff"></span>Full-body stretching</div>
      <div class="ract"><span class="rdot" style="background:#ff8c42"></span>Yoga or foam rolling</div>
      <div class="ract"><span class="rdot" style="background:#6b6b6b"></span>Hydrate & eat well</div>
    </div>
  </div></div>`;

  const exs = EX[workout]||[];
  const tot = exs.reduce((a,e)=>a+(e.sets||0),0);
  return `<div class="panel">
    <div class="sess-hdr">
      <div class="sh-top">
        <div class="sh-info">
          <div class="sh-name">${LBL[workout]}</div>
          <div class="sh-type">${TYPE[workout]||''}</div>
        </div>
        <div class="sh-stats">
          <div class="stat"><div class="stat-n">${exs.length}</div><div class="stat-l">Exs</div></div>
          <div class="stat"><div class="stat-n">${tot}</div><div class="stat-l">Sets</div></div>
        </div>
      </div>
      ${mPanel(workout)}
    </div>
    <div class="ex-list">${exs.map((e,i)=>exCard(e,i,workout)).join('')}</div>
  </div>`;
}

function buildSched(){
  sched=[];
  for(let i=-2;i<=4;i++){ const d=new Date(viewDate); d.setDate(d.getDate()+i); sched.push({date:d,workout:getW(d)}); }
  ai=2;
}

function renderStrip(){
  const s=document.getElementById('strip'); s.innerHTML='';
  sched.forEach((item,idx)=>{
    const c=document.createElement('div');
    const wd=item.date.toLocaleDateString('en-US',{weekday:'short'});
    const td=isToday(item.date);
    c.className='chip'+(idx===ai?' active':'');
    c.innerHTML=`<span class="chip-wr">${LBL[item.workout]}</span><span class="chip-dt">${wd} ${item.date.getDate()}</span>${td?'<span class="today-dot"></span>':''}`;
    c.addEventListener('click',()=>goTo(idx));
    s.appendChild(c);
  });
  setTimeout(()=>{ const ch=s.querySelectorAll('.chip'); if(ch[ai]) ch[ai].scrollIntoView({inline:'center',behavior:'smooth',block:'nearest'}); },50);
}

function renderSlider(){
  const sl=document.getElementById('sl');
  sl.style.transition='none';
  sl.innerHTML=sched.map(item=>buildPanel(item)).join('');
  setT(false);
}

function setT(anim){
  const sl=document.getElementById('sl');
  const vw=document.getElementById('vp').offsetWidth;
  sl.style.transition=anim?'transform .4s cubic-bezier(.4,0,.2,1)':'none';
  sl.style.transform=`translateX(${-ai*vw}px)`;
  if(!anim) void sl.offsetWidth;
}

function renderNav(){
  const nav=document.getElementById('bnav');
  const ws=['upper-a','upper-b','upper-c','upper-d','lower-a','lower-b','rest'];
  const ls=['Up A','Up B','Up C','Up D','Low A','Low B','Rest'];
  const cur=sched[ai]?.workout;
  nav.innerHTML=ws.map((w,i)=>`<button class="npill${cur===w?' on':''}" onclick="jumpTo('${w}')">${ls[i]}</button>`).join('');
}

function goTo(idx){
  ai=idx; viewDate=new Date(sched[idx].date);
  setT(true);
  document.querySelectorAll('.chip').forEach((c,i)=>{
    c.classList.toggle('active',i===idx);
    if(i===idx) c.scrollIntoView({inline:'center',behavior:'smooth',block:'nearest'});
  });
  renderNav();
}

function jumpTo(w){
  const base=new Date();
  for(let i=0;i<=30;i++){
    for(const sg of [1,-1]){
      const d=new Date(base); d.setDate(d.getDate()+sg*i);
      if(getW(d)===w){ viewDate=d; buildSched(); renderStrip(); renderSlider(); renderNav(); return; }
    }
  }
}

function todayDateStr(){
  const n=new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}

function goToToday(){
  viewDate=new Date();
  buildSched(); renderStrip(); renderSlider(); renderNav();
  document.getElementById('dateInput').value=todayDateStr();
}

document.getElementById('todayBtn').addEventListener('click',goToToday);
const dateInput=document.getElementById('dateInput');
dateInput.value=todayDateStr();
dateInput.addEventListener('change',()=>{
  if(!dateInput.value) return;
  const p=dateInput.value.split('-');
  viewDate=new Date(+p[0],+p[1]-1,+p[2]);
  buildSched(); renderStrip(); renderSlider(); renderNav();
});

(function(){
  const vp=document.getElementById('vp');
  let sx=0,sy=0,drag=false,horiz=null,dx=0;
  function onStart(x,y){ sx=x;sy=y;drag=true;horiz=null;dx=0;document.getElementById('sl').style.transition='none'; }
  function onMove(x,y){
    if(!drag) return; dx=x-sx; const dy=y-sy;
    if(horiz===null) horiz=Math.abs(dx)>Math.abs(dy);
    if(!horiz) return;
    const vw=vp.offsetWidth; document.getElementById('sl').style.transform=`translateX(${-ai*vw+dx}px)`;
  }
  function onEnd(){
    if(!drag||!horiz){ drag=false; setT(true); return; }
    drag=false; const th=vp.offsetWidth*0.22;
    if(dx<-th&&ai<sched.length-1) goTo(ai+1);
    else if(dx>th&&ai>0) goTo(ai-1);
    else setT(true);
  }
  vp.addEventListener('touchstart',e=>{const t=e.touches[0];onStart(t.clientX,t.clientY);},{passive:true});
  vp.addEventListener('touchmove', e=>{const t=e.touches[0];onMove(t.clientX,t.clientY);},{passive:true});
  vp.addEventListener('touchend',onEnd);
  vp.addEventListener('mousedown',e=>onStart(e.clientX,e.clientY));
  window.addEventListener('mousemove',e=>{if(drag)onMove(e.clientX,e.clientY);});
  window.addEventListener('mouseup',onEnd);
  window.addEventListener('resize',()=>setT(false));
})();

buildSched(); renderStrip(); renderSlider(); renderNav();
</script>
</body>
</html>
